name: Complete Eriqa rebrand

on:
  push:
    branches: [nimajnebrevilo-patch-1]

permissions:
  contents: write

jobs:
  rebrand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nimajnebrevilo-patch-1
      - name: Replace legacy branding in text files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            perl -0pi -e 's/DemandIntel/Eriqa/g; s/DEMANDINTEL_/ERIQA_/g; s/demandintel\.io/eriqa.io/g; s/mcp__DemandIntel__/mcp__Eriqa__/g; s/~\/\.cursor\/demandintel-skills/~\/.cursor\/eriqa-skills/g; s/~\/\.codex\/demandintel-skills/~\/.codex\/eriqa-skills/g; s/\bdemandintel\b/eriqa/g' "$f"
            perl -0pi -e 's#github\.com/eriqa/eriqa-skills-resource#github.com/demandintel/eriqa-skills-resource#g; s#raw\.githubusercontent\.com/eriqa/eriqa-skills-resource#raw.githubusercontent.com/demandintel/eriqa-skills-resource#g' "$f"
          done < <(find . -type f ! -path './.git/*' ! -path './downloads/*.zip' ! -path './.github/workflows/eriqa-rebrand.yml' -print0)

      - name: Rebuild downloadable skill bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f downloads/sales-training-content-skill.zip ]; then
            tmp="$(mktemp -d)"
            unzip -q downloads/sales-training-content-skill.zip -d "$tmp"
            while IFS= read -r -d '' f; do
              perl -0pi -e 's/DemandIntel/Eriqa/g; s/DEMANDINTEL_/ERIQA_/g; s/demandintel\.io/eriqa.io/g; s/mcp__DemandIntel__/mcp__Eriqa__/g; s/\bdemandintel\b/eriqa/g' "$f"
            done < <(find "$tmp" -type f -print0)
            rm downloads/sales-training-content-skill.zip
            (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/downloads/sales-training-content-skill.zip" .)
            rm -rf "$tmp"
          fi

      - name: Assert no legacy brand remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'DemandIntel|DEMANDINTEL_|demandintel\.io|mcp__DemandIntel__|\.cursor/demandintel-skills|\.codex/demandintel-skills' . --exclude-dir=.git --exclude='*.zip' --exclude='eriqa-rebrand.yml'; then
            echo 'Legacy DemandIntel branding remains in text files.' >&2
            exit 1
          fi
          unzip -p downloads/sales-training-content-skill.zip 2>/dev/null | grep -aE 'DemandIntel|DEMANDINTEL_|demandintel\.io|mcp__DemandIntel__' && {
            echo 'Legacy DemandIntel branding remains in downloadable ZIP.' >&2
            exit 1
          } || true

      - name: Remove one-time migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/eriqa-rebrand.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Complete repo-wide Eriqa rebrand'
          git push origin HEAD:nimajnebrevilo-patch-1
