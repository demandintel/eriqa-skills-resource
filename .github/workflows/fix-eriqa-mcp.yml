name: Fix canonical Eriqa MCP endpoint
on:
  push:
    branches: [nimajnebrevilo-patch-1]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nimajnebrevilo-patch-1
      - shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            perl -0pi -e 's#https://mcp\.eriqa\.io#https://mcp.app.eriqa.io/v1#g' "$f"
          done < <(find . -type f ! -path './.git/*' ! -path './downloads/*.zip' ! -path './.github/workflows/fix-eriqa-mcp.yml' -print0)
          tmp="$(mktemp -d)"
          unzip -q downloads/sales-training-content-skill.zip -d "$tmp"
          while IFS= read -r -d '' f; do perl -0pi -e 's#https://mcp\.eriqa\.io#https://mcp.app.eriqa.io/v1#g' "$f"; done < <(find "$tmp" -type f -print0)
          rm downloads/sales-training-content-skill.zip
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/downloads/sales-training-content-skill.zip" .)
          rm -rf "$tmp"
          rm -f .github/workflows/fix-eriqa-mcp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use canonical Eriqa MCP endpoint' || exit 0
          git push origin HEAD:nimajnebrevilo-patch-1
